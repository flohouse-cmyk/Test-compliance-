name: Deploy to GitHub Pages

on:
  # Deploys run from the default branch — the only branch the github-pages
  # environment permits to publish. Develop on the feature branch, then
  # promote to the default branch to publish.
  push:
    branches:
      - claude/nice-franklin-i7qjko
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let in-flight runs finish (avoids half-swapped state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # NOTE: actions/configure-pages with enablement was removed — it kept
      # resetting the Pages source. Pages "Source" must be set to "GitHub
      # Actions" once in repo Settings; this workflow no longer touches it.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
